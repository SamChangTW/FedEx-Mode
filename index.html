<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FedEx 模式｜智能發票解析 v2.0</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css" />
  
  <link rel="stylesheet" href="ui/tsaa_tokens.css" />
  <link rel="stylesheet" href="ui/scheduler.css" />

  <script>
    // 設定當前版本號 (更新此字串以強制 PWA 更新)
    const APP_VERSION = 'v2.0-ner-clean';

    if (localStorage.getItem('pwa_version') !== APP_VERSION) {
      console.log('偵測到新版本，執行清理...');
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for(let registration of registrations) registration.unregister();
        });
      }
      if ('caches' in window) {
        caches.keys().then(function(names) {
          for (let name of names) caches.delete(name);
        });
      }
      localStorage.setItem('pwa_version', APP_VERSION);
      setTimeout(() => {
        alert('系統已升級至 v2.0 (純文字解析版)，將重新載入。');
        window.location.reload(true); 
      }, 200);
    } else {
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW 失敗:', err));
        });
      }
    }
  </script>
</head>
<body class="theme-scheduler tsaa-layout">
  <header>
    <h1>商業發票助手</h1>
    <div class="sub">v2.0 · 智能文字解析 · 複製貼上版</div>
  </header>

  <main>
    <section class="tsaa-card">
      <h2>1) 文字輸入</h2>
      
      <div class="row" style="margin-bottom: 8px;">
        <small id="textExtractStatus" style="display:block; color:#ccc; line-height:1.5;">
          <b>操作方式：</b>請從手機相簿或 Email <b>「複製」</b>發票文字，貼入下方空格，再按下按鈕。
        </small>
      </div>

      <textarea id="rawText" rows="6" 
        placeholder="長按此處貼上發票內容...
範例：
FedEx AWB: 7721 6500 0095
Date: 2023-10-25
Total: 120.00 USD
..."></textarea>
      
      <div class="row" style="margin-top:10px;">
        <button id="btnRunNER" type="button" class="tsaa-btn" style="width:100%; font-weight:bold;">
          ⚡ 執行智能帶入 (NER)
        </button>
      </div>
    </section>

    <section class="tsaa-card">
      <h2>2) 欄位確認</h2>
      <div class="grid">
        <label>AWB 編號
          <input id="awb" inputmode="numeric" placeholder="例如：772165000095" />
        </label>
        <label>發票日期
          <input id="date" placeholder="YYYY-MM-DD" />
        </label>
        <label class="full">寄件人（Sender）
          <input id="seller" placeholder="公司名稱或姓名" />
        </label>
        <label class="full">寄件人地址（Sender Address）
          <textarea id="sellerAddr" placeholder="街道、城市、國家..." rows="2"></textarea>
        </label>
        <label class="full">收件人（Recipient）
          <input id="buyer" placeholder="公司名稱或姓名" />
        </label>
        <label class="full">收件人地址（Recipient Address）
          <textarea id="buyerAddr" placeholder="街道、城市、國家..." rows="2"></textarea>
        </label>
        <label>國家（Country）
          <input id="country" placeholder="例如：Taiwan / USA" />
        </label>
        <label>郵遞區號（Postal Code）
          <input id="postalCode" placeholder="例如：100" />
        </label>
        <label>電話（Phone）
          <input id="phone" placeholder="例如：+886 912345678" />
        </label>
        <label class="full">貨品說明（Description）
          <input id="desc" placeholder="例如：Paperboard Box" />
        </label>
        <label>金額（Amount / USD）
          <input id="amount" type="number" step="0.01" placeholder="例如：120.00" />
        </label>
        <label>重量（Weight）
          <input id="weight" placeholder="例如：0.50 KG" />
        </label>
        <label>件數（Pieces）
          <input id="pieces" inputmode="numeric" placeholder="例如：1" />
        </label>
      </div>
      <div class="row">
        <button id="btnClear" type="button" class="tsaa-btn" style="background:#ef4444; border-color:#ef4444; color:white;">清空所有欄位</button>
      </div>
    </section>

    <section class="tsaa-card">
      <h2>3) 輸出 PDF</h2>
      <div class="row" style="margin-bottom:10px;">
        <label style="display:flex;align-items:center;gap:8px;">
          <input id="useFedExTpl" type="checkbox" checked /> 
          使用 FedEx 風格背景
        </label>
      </div>
      
      <div class="row" id="tplRow" style="display:flex; gap:8px; align-items:center; margin-bottom:15px; padding:8px; border-radius:4px; background:rgba(255,255,255,0.05);">
        <input id="tplInput" type="file" accept="image/png, image/jpeg, application/pdf" />
        <small style="font-size:0.75rem; opacity:0.7;">(選用) 上傳底圖</small>
      </div>

      <div class="row">
        <button id="btnPdf" type="button" class="tsaa-btn">📄 生成 PDF 並下載</button>
        <span id="outStatus" style="margin-left:8px; font-weight:bold; color:var(--tsaa-color-accent);"></span>
      </div>
    </section>
  </main>

  <footer>
    <small>Invoice Helper v2.0 · 移除 OCR 模組 · 僅需貼上文字</small>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  
  <script src="main.js?v=2.0-clean"></script>
  <script src="ui/theme-loader.js"></script>
</body>
</html>
