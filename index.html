<!doctype html>
<html lang="zh-Hant">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="拍照 OCR 智能帶入欄位，一鍵生成 FedEx 商業發票 PDF，支援離線使用（PWA）" />
  <meta name="theme-color" content="#C8B47E" />
  <title>FedEx 模式｜OCR 商業發票 v1.9-gemini</title>
  <link rel="manifest" href="manifest.json">

  <!-- 所有樣式表集中在 head，避免 FOUC（樣式閃爍）-->
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="ui/tsaa_tokens.css" />

  <!-- 更新通知 Toast 樣式 -->
  <style>
    #update-toast {
      display: none;
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: linear-gradient(135deg, #C8B47E, #9E7F43);
      color: #1E2A44;
      font-weight: 700;
      font-size: 14px;
      padding: 12px 22px;
      border-radius: 999px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      z-index: 9999;
      text-align: center;
      max-width: 90vw;
      animation: toast-in 0.3s ease;
    }

    @keyframes toast-in {
      from {
        opacity: 0;
        transform: translateX(-50%) translateY(-10px);
      }

      to {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
    }
  </style>

  <script>
    const APP_VERSION = 'v1.9-gemini';

    function showUpdateToast(msg) {
      const el = document.getElementById('update-toast');
      if (el) { el.textContent = msg; el.style.display = 'block'; }
    }

    // 版本檢查：await 確保清除完成後才 reload，消除競態條件
    if (localStorage.getItem('pwa_version') !== APP_VERSION) {
      (async () => {
        console.log('[PWA] 偵測到舊版本，開始強制清理...');
        if ('serviceWorker' in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.map(r => r.unregister()));
          console.log('[PWA] 舊版 SW 已全數註銷');
        }
        if ('caches' in window) {
          const cacheNames = await caches.keys();
          await Promise.all(cacheNames.map(name => caches.delete(name)));
          console.log('[PWA] 所有舊快取已清除');
        }
        localStorage.setItem('pwa_version', APP_VERSION);
        showUpdateToast(`✨ 系統已更新至最新版 (${APP_VERSION})，正在重新載入…`);
        setTimeout(() => window.location.reload(true), 1500);
      })();
    } else {
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js')
            .then(reg => console.log('[PWA] SW 註冊成功:', reg.scope))
            .catch(err => console.error('[PWA] SW 註冊失敗:', err));
        });
      }
    }
  </script>
</head>

<body class="theme-scheduler tsaa-layout">

  <!-- 更新通知 Toast（版本更新時顯示）-->
  <div id="update-toast"></div>

  <header>
    <h1>商業發票（OCR）</h1>
    <div class="sub" id="app-subtitle">v1.9-gemini · 手機版 · 鈦灰 × 香檳金</div>
  </header>

  <main>
    <section class="tsaa-card">
      <h2>1) 取像與文字</h2>

      <!-- Gemini API Key 設定區 -->
      <div id="geminiSettingsBar">
        <div class="gemini-settings-header">
          <span id="geminiModeLabel" class="gemini-mode-label"></span>
          <button id="btnToggleGeminiSettings" type="button" class="tsaa-btn btn-sm">&#9881; Gemini 設定</button>
        </div>
        <div id="geminiSettingsPanel">
          <div class="gemini-panel-inner">
            <label class="gemini-panel-label">✨ Gemini API Key（儲存於本機，不會上傳）</label>
            <div class="gemini-key-row">
              <input id="geminiApiKeyInput" type="password" placeholder="輸入 Gemini API Key" class="gemini-key-input" />
              <button id="btnSaveGeminiKey" type="button" class="tsaa-btn btn-sm">&#10003; 儲存</button>
              <button id="btnClearGeminiKey" type="button" class="tsaa-btn btn-sm btn-danger">&#10005; 清除</button>
            </div>
            <small class="gemini-key-hint">從 <a href="https://aistudio.google.com/app/apikey" target="_blank">Google AI Studio</a> 取得免費 Key</small>
          </div>
        </div>
      </div>

      <div class="row" style="gap:8px; align-items:center; flex-wrap:wrap;">
        <label id="btnCameraText" for="photoInput" role="button" class="tsaa-btn">
          啟動相機（拍照取文字）
        </label>
        <button id="btnRunNER" type="button" class="tsaa-btn">使用文字智能帶入（NER）</button>
        <small id="textExtractStatus" style="opacity:.8"></small>
      </div>
      <input id="photoInput" type="file" accept="image/*" capture="environment"
        style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0;" />
      <textarea id="rawText" rows="5" placeholder="將從相片擷取的文字會顯示在此，或可直接貼上（標籤、AWB、發票或螢幕截圖文字）"></textarea>
      <small style="display:block;opacity:.7;margin-top:4px;line-height:1.4;">
        說明：有 Gemini API Key 時拍照將直接由 AI 辨識填入欄位。無 Key 時降級為本地 Tesseract OCR + NER。
      </small>
    </section>

    <section class="tsaa-card">
      <h2>2) 欄位確認</h2>
      <div class="grid">
        <label>AWB 編號
          <input id="awb" inputmode="numeric" placeholder="例如：772165000095" />
        </label>
        <label>發票日期
          <input id="date" placeholder="YYYY-MM-DD" />
        </label>
        <label class="full">寄件人（Sender）
          <input id="seller" placeholder="公司名稱或姓名" />
        </label>
        <label class="full">寄件人地址（Sender Address）
          <textarea id="sellerAddr" placeholder="街道與門牌號、城市、州/省、郵遞區號、國家" rows="2"></textarea>
        </label>
        <label class="full">收件人（Recipient）
          <input id="buyer" placeholder="公司名稱或姓名" />
        </label>
        <label class="full">收件人地址（Recipient Address）
          <textarea id="buyerAddr" placeholder="街道與門牌號、城市、州/省、郵遞區號、國家" rows="2"></textarea>
        </label>
        <label>國家（Country）
          <input id="country" placeholder="例如：Taiwan / 美國 / JP / TW" />
        </label>
        <label>郵遞區號（Postal Code）
          <input id="postalCode" placeholder="例如：100、90210、10110" />
        </label>
        <label>電話（Phone）
          <input id="phone" placeholder="例如：+886 912345678" />
        </label>
        <label class="full">貨品說明（Description）
          <input id="desc" placeholder="例如：Paperboard Box" />
        </label>
        <label>金額（Amount / USD）
          <input id="amount" type="number" step="0.01" placeholder="數字，例如：120.00" />
        </label>
        <label>重量（Weight）
          <input id="weight" placeholder="例如：0.50 KG 或 1 LB" />
        </label>
        <label>件數（Pieces）
          <input id="pieces" inputmode="numeric" placeholder="例如：1" />
        </label>
      </div>
      <div class="row">
        <button id="btnClear" type="button" class="tsaa-btn">清空欄位</button>
      </div>
    </section>

    <section class="tsaa-card">
      <h2>3) 輸出</h2>
      <div class="row">
        <button id="btnPdf" type="button" class="tsaa-btn">生成 PDF（制式表格）</button>
        <span id="outStatus"></span>
      </div>
      <div class="row">
        <label style="display:flex;align-items:center;gap:8px;">
          <input id="useFedExTpl" type="checkbox" checked /> 使用 FedEx 官方版型（背景疊字）
        </label>
      </div>
      <div class="row" id="tplRow" style="display:flex;gap:8px;align-items:center;">
        <input id="tplInput" type="file" accept="image/png, image/jpeg, application/pdf" />
        <small>可上傳模板（PDF/PNG/JPG）。若留空，將嘗試載入 assets/fedex-commercial-invoice-form-tw.pdf</small>
      </div>
    </section>
  </main>

  <footer>
    <small>Public template · 無簽名 · 無 Logo · 僅必要欄位 · 可離線使用（PWA）</small>
  </footer>

  <!-- 外部套件 -->
  <script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <!-- 主邏輯 -->
  <script src="main.js?v=gemini"></script>
  <!-- 主題載入（最後執行，供覆蓋 CSS 變數）-->
  <script src="ui/theme-loader.js"></script>
</body>

</html>
